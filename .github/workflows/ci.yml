name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Type-check & validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate fixtures
        run: |
          # Assemble combined submissions fixture from split parts if needed
          if [ ! -f app/public/fixtures/submissions.sample.json ]; then
            python3 -c "
import json, os
d = 'app/public/fixtures'
parts = ['submissions.sample.part1.json', 'submissions.sample.part2.json', 'submissions.sample.part3.json']
combined = [r for f in parts for r in json.load(open(os.path.join(d, f)))]
json.dump(combined, open(os.path.join(d, 'submissions.sample.json'), 'w'))
print(f'{len(combined)} submission records assembled')
"
          fi
          node scripts/validate-fixtures.js

      - name: Build (type-check + bundle)
        working-directory: app
        run: npm run build
